name: civicbridge-ai-benchmarks

on:
  push:
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: sqlite:////tmp/civicbridge-benchmark.db
      MONGO_URI: mongodb://localhost:27017
      MONGO_DATABASE: civicbridge_benchmark
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Start API
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/civicbridge.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          cat /tmp/civicbridge.log
          exit 1
      - name: Run load test
        run: python benchmarks/load_test.py | tee civicbridge-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: civicbridge-load-results
          path: civicbridge-benchmark.json
