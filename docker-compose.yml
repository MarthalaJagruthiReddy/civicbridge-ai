services:
  mongo:
    image: mongo:8
    volumes:
      - civicbridge-mongo:/data/db

  api:
    build: ./backend
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: sqlite:///./civicbridge.db
      MONGO_URI: mongodb://mongo:27017
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    volumes:
      - civicbridge-data:/app
    depends_on:
      - mongo

volumes:
  civicbridge-data:
  civicbridge-mongo:
